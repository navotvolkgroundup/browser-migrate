name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One active run per ref: pushing to a branch cancels its stale run
  # instead of letting superseded runs burn minutes (macOS bills at 10x).
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Safari adapter tests shell out to plutil (macOS-only); they run in
      # the macos-safari job below and in release.yml before any build.
      - run: bun test $(ls test/*.test.ts | grep -v safari)

  macos-safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test test/safari.test.ts
